<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0c1929"/>
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#111d2e" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <!-- Cloud icons -->
  <circle cx="200" cy="160" r="50" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <text x="200" y="165" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16" opacity="0.8">AWS</text>
  <circle cx="400" cy="160" r="50" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <text x="400" y="165" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="16" opacity="0.8">GCP</text>
  <!-- Connection line -->
  <line x1="250" y1="160" x2="350" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,4" opacity="0.4"/>
  <!-- AI Node -->
  <rect x="265" y="130" width="70" height="60" rx="8" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="300" y="165" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14">GenAI</text>
  <!-- Bottom text -->
  <text x="300" y="280" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">Multi-Cloud Agent Architecture</text>
  <text x="300" y="310" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">Rimac Seguros — 2025</text>
</svg>
