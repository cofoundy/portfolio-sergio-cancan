<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0c1929"/>
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#111d2e" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <!-- Chat bubbles -->
  <rect x="100" y="100" width="200" height="50" rx="12" fill="#1e293b"/>
  <text x="120" y="130" fill="#94a3b8" font-family="monospace" font-size="13">¿Cuál es mi saldo?</text>
  <rect x="300" y="170" width="200" height="50" rx="12" fill="#38bdf8" opacity="0.2"/>
  <text x="320" y="200" fill="#38bdf8" font-family="monospace" font-size="13">Tu saldo es S/.2,450</text>
  <!-- Accuracy bar -->
  <rect x="120" y="260" width="360" height="8" rx="4" fill="#1e293b"/>
  <rect x="120" y="260" width="324" height="8" rx="4" fill="#38bdf8" opacity="0.7"/>
  <text x="300" y="295" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">Precisión: 10% → 90%</text>
  <text x="300" y="320" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">Amazon Lex + Bedrock + Lambda</text>
</svg>
